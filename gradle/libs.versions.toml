[versions]
kotlin = "2.4.21"
agp = "9.4.1"
koinBom = "4.2.2"
coroutines = "1.11.0"
ktor = "3.6.0"
composeBom = "2026.09.00"
lifecycle = "2.11.0"
carApp = "1.7.0"

[libraries]
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koinBom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-android-compose = { module = "io.insert-koin:koin-androidx-compose" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }

androidx-core = { module = "androidx.core:core-ktx", version = "1.19.1" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version = "1.2.0" }
androidx-activityCompose = { module = "androidx.activity:activity-compose", version = "1.13.0" }

androidx-car = { module = "androidx.car.app:app", version.ref = "carApp" }
androidx-car-projected = { module = "androidx.car.app:app-projected", version.ref = "carApp" }
androidx-car-automotive = { module = "androidx.car.app:app-automotive", version.ref = "carApp" }

lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-savedState = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-toolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-core" }
compose-navigation = { module = "androidx.navigation:navigation-compose", version = "2.10.2" }
compose-wear-material = { module = "androidx.wear.compose:compose-material", version = "1.7.1" }
compose-wear-ui-toolingPreview = { module = "androidx.wear.compose:compose-ui-tooling", version = "1.7.1" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version = "6.1.3" }
junit-plaftormLauncher = { module = "org.junit.platform:junit-platform-launcher", version = "6.1.3" }
mockk = { module = "io.mockk:mockk", version = "1.14.11" }
kotest = { module = "io.kotest:kotest-assertions-core", version = "6.2.5" }
turbine = { module = "app.cash.turbine:turbine", version = "1.2.1" }

# build-logic dependencies
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[bundles]
ktor = ["ktor-core", "ktor-auth", "ktor-logging", "ktor-android"]
lifecycle = ["lifecycle-viewmodel", "lifecycle-viewmodel-savedState"]
lifecycle-compose = ["lifecycle-viewmodel-compose", "lifecycle-runtime-compose"]
test = ["kotlinx-coroutines-test", "junit-jupiter", "mockk", "kotest", "turbine", "junit-plaftormLauncher"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

android-app = { id = "com.android.application", version.ref = "agp" }
android-lib = { id = "com.android.library", version.ref = "agp" }